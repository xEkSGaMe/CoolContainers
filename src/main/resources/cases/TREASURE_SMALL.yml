    chance: 8.4
    amount: 1
    items:
      - material: ENCHANTED_BOOK
        amount: 1
        enchantments:
          - "unbreaking:3"

  - id: book_mending_1
    display-name: "<green>Книга: Починка</green>"
    chance: 8.4
    amount: 1
    items:
      - material: ENCHANTED_BOOK
        amount: 1
        enchantments:
          - "mending:1"