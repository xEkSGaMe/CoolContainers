  - id: warden_15d
    display-name: "<gradient:#1b9007:#37a400><bold>WARDEN</bold></gradient> <gray>на <white>15</white> дней</gray>"
    chance: 60.0
    amount: 1
    luckperms: { group: warden, duration: 15d, server: global }
    broadcast:
      - "<white>{player} <gray>выиграл <gradient:#1b9007:#37a400><bold>WARDEN</bold></gradient> <gray>на <white>15 дней</white> <gray>из Малого донат-кейса"

