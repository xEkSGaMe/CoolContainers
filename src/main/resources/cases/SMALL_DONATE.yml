type: SMALL_DONATE
display-name: "<gradient:#87CEEB:#FFD700><bold>Малый Донатный Кейс</bold></gradient>"
permission: cases.open.small_donate

hologram:
  enabled: true
  offset-y: 2.4
  lines:
    - "<gradient:#87CEEB:#FFD700><bold>Малый донат-кейс</bold></gradient>"
    - "<gray>ПКМ чтобы открыть</gray>"

animation:
  type: bee

rewards:
