    display-name: "<gradient:#1b9007:#37a400><bold>WARDEN</bold></gradient> <gray>на <white>30</white> дней</gray>"
    chance: 68.83
    amount: 1
    luckperms:
      group: warden
      duration: 30d
      server: global
    broadcast:
      - "<white>{player} <gray>выиграл <gradient:#1b9007:#37a400><bold>WARDEN</bold></gradient> <gray>на <white>30 дней</white> <gray>из Донат-кейса"

