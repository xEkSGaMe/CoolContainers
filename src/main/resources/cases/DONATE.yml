type: DONATE
display-name: "<gradient:#FFD700:#FF8C00><bold>Донатный Кейс</bold></gradient>"
permission: cases.open.donate

hologram:
  enabled: true
  offset-y: 2.4
  lines:
    - "<gradient:#FFD700:#FF8C00><bold>Донат-кейс</bold></gradient>"
    - "<gray>ПКМ чтобы открыть</gray>"

animation:
  type: bee

