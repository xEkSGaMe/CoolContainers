# Глобальные дефолты для анимации treasure.
# Любой параметр можно переопределить в самом кейсе (см. YAML кейса).

# Блок-счётчик по умолчанию. Если в кейсе не указан block-type — берётся этот.
# Если блок не RespawnAnchor, charges не используются, но партиклы/звуки
# при каждом «заряде» всё равно работают.
default-block-type: RESPAWN_ANCHOR

# Максимальное число «зарядов» (0..N). Для RespawnAnchor hard-limit = 4.
default-max-charges: 4

# Длительность заливки 0→max-charges.
fill-ticks: 40

# «Зарядка» после заливки (частицы слетаются к центру).
windup-ticks: 15

# Жёсткий лимит всей сессии.
session-timeout-seconds: 60

# На сколько блоков предмет поднимается над блоком.
rise-height: 2

# Длительность подъёма предмета.
rise-ticks: 25

# Сколько тиков финальный предмет висит над блоком.
display-ticks: 100